name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.2.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        # OpenCode Go serves an OpenAI-compatible surface, so it is reached
        # through OpenWiki's `openai-compatible` provider rather than a
        # dedicated one. The base URL must be the API root: OpenWiki rejects a
        # value ending in /chat/completions.
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://opencode.ai/zen/go/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENWIKI_MODEL_ID: glm-5.2
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Only what OpenWiki actually regenerates. This workflow file is
          # deliberately excluded: GITHUB_TOKEN is not allowed to push changes
          # under .github/workflows, so listing it would fail the push the one
          # time it was not empty.
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.

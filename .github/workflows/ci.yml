name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only runtimes this runner image is known to carry. Adding one means
        # pairing it with a runner that has it — the resolve step below fails
        # loudly rather than falling back, so an unavailable entry turns CI red.
        #
        # The support floor (iOS 17) cannot be listed: swift-tools 6.2 rules
        # out every Xcode old enough to bundle an iOS 17 runtime, and Xcode
        # 26/27 ship only their own. The floor is upheld by API availability at
        # compile time, not by a test run.
        runtime: ["26"]
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve simulator
        id: simulator
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          # Pick a device on the requested runtime rather than whichever
          # simulator is listed first: falling back to another OS silently
          # would report a pass for a version nobody asked to test.
          if ! UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys

          prefix = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["RUNTIME"]
          devices = json.load(sys.stdin)["devices"]
          for identifier, entries in sorted(devices.items()):
              if not identifier.startswith(prefix):
                  continue
              for device in entries:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          '); then
            echo "::error::No available iPhone simulator on an iOS ${RUNTIME}.x runtime."
            xcrun simctl list runtimes
            exit 1
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # The step budget is the backstop, and it is deliberately not the job's:
      # a wedged simulator once cost the job all 30 of its minutes, and all CI
      # could say afterwards was "exceeded the maximum execution time" — no
      # test named, no result bundle. Build plus suite takes about four
      # minutes, so twelve is a hang, not a slow runner.
      #
      # It has to be a step timeout rather than only the xcodebuild flags
      # below, because those cover XCTest and this suite is mostly Swift
      # Testing, whose time limits are a separate opt-in trait. The flags
      # sharpen the common case; this bounds every other one, including a
      # simulator that never finishes booting.
      - name: Run tests
        timeout-minutes: 12
        run: |
          set -euo pipefail

          # Capping an individual test names the one that hung and lets the
          # rest of the suite still run. XCTest enforces a one minute floor on
          # the allowance — a smaller number is accepted and silently rounded
          # up to 60s — so 120 is the first value that reads as deliberate.
          # The slowest test here takes a few seconds.
          xcodebuild -scheme FineUIKit \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            test
